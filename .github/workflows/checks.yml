name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: uv sync --frozen --python 3.12 --extra login
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: uv run --frozen --extra login python scripts/check.py
      - run: uv run --frozen --extra login ai-memory demo --output data/ci-demo
      - run: uv run --frozen --extra login python scripts/mcp_smoke.py --db data/ci-demo/conversations.sqlite
      - run: uv run --frozen --extra login python scripts/package_extension.py
      - run: uv build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: ai-memory-build
          path: dist/*
