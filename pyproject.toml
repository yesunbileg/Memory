[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-memory-archive"
version = "0.1.0"
description = "Lossless AI conversation archive with NotebookLM memory and MCP"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["notebooklm-py==0.8.6", "mcp>=1.26,<2"]

[project.optional-dependencies]
login = ["notebooklm-py[cookies]==0.8.6"]
docs = ["playwright==1.62.0"]

[project.scripts]
ai-memory = "ai_memory.cli:main"

[dependency-groups]
dev = [
    "playwright==1.62.0",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.26,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Python distributions are not repository snapshots. Select runtime sources
# explicitly: forcing a whole vendor directory also copies untracked files.
[tool.hatch.build]
include = [
    "/src/ai_memory/*.py",
    "/src/ai_memory/web_docs_driver.js",
    "/src/ai_memory/web_docs_background.cjs",
    "/vendor/hstry/adapters/codex/adapter.ts",
    "/vendor/hstry/adapters/opencode/adapter.ts",
    "/vendor/hstry/adapters/types/first-message.ts",
    "/vendor/hstry/adapters/types/index.ts",
    "/vendor/hstry/adapters/types/package.json",
    "/vendor/hstry/LICENSE",
    "/vendor/hstry/UPSTREAM.json",
    "/vendor/hstry/PATCHES.md",
]

[tool.hatch.build.targets.sdist]
artifacts = ["/README.md", "/THIRD_PARTY_NOTICES.md"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"vendor/hstry" = "ai_memory/vendor/hstry"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "PIE"]
